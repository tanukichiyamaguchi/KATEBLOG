name: Weekly Auto Publish (queue → output)

# 週1回、queue/ にストックした記事を1本だけ output/ へ移動し、
# 画像（OpenAI写真風 / sharp）を生成して commit & push する。
# その後 WordPress プラグインが1時間以内に取り込み、当日11:00（JST）に予約公開する。
#
# 注意:
#  - schedule（cron）は GitHub の仕様上「デフォルトブランチ」のワークフローしか起動しません。
#    本番運用ではこのファイルをデフォルトブランチに置き、WPプラグインの「ブランチ」設定を
#    push 先ブランチ（このワークフローが動くブランチ）に合わせてください。
#  - 手動実行（Run workflow）は任意のブランチで可能です。

on:
  schedule:
    # 毎週日曜 20:00 UTC = 毎週月曜 05:00 JST（→ 当日 月曜 11:00 JST 公開予定）
    - cron: '0 20 * * 0'
  workflow_dispatch:
    inputs:
      date:
        description: '公開日 YYYY-MM-DD（空なら当日JST）'
        required: false
      time:
        description: '公開時刻 HH:MM'
        required: false
        default: '11:00'
      provider:
        description: '画像プロバイダ openai | sharp | auto'
        required: false
        default: 'auto'

permissions:
  contents: write

jobs:
  publish-next:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Create .env (OpenAI image key)
        run: |
          : > .env
          if [ -n "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
          fi
          echo "OPENAI_IMAGE_MODEL=${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-1' }}" >> .env
          echo "OPENAI_IMAGE_QUALITY=${{ vars.OPENAI_IMAGE_QUALITY || 'high' }}" >> .env
          echo "IMAGE_PROVIDER=${{ github.event.inputs.provider || 'auto' }}" >> .env

      - name: Publish next from queue
        id: publish
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="$ARGS --date ${{ github.event.inputs.date }}"; fi
          if [ -n "${{ github.event.inputs.time }}" ]; then ARGS="$ARGS --time ${{ github.event.inputs.time }}"; fi
          if [ -n "${{ github.event.inputs.provider }}" ]; then ARGS="$ARGS --provider ${{ github.event.inputs.provider }}"; fi
          node cli.js publish-next $ARGS

      - name: Commit & push if changed
        run: |
          if [ -n "$(git status --porcelain output briefs queue)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add output briefs queue
            git commit -m "chore(weekly): publish next queued article ($(date +%Y-%m-%d))"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "変更なし（キューが空、または公開対象なし）。スキップします。"
          fi
